<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ba0" />
      <stop offset="50%" stop-color="#002244" />
      <stop offset="100%" stop-color="#001428" />
    </linearGradient>
    <linearGradient id="skyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <linearGradient id="skySkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c68642" />
      <stop offset="100%" stop-color="#a06025" />
    </linearGradient>
    <linearGradient id="skyJersey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="50%" stop-color="#0747a6" />
      <stop offset="100%" stop-color="#003380" />
    </linearGradient>
    <filter id="skyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle with 360-degree ring -->
  <circle cx="100" cy="100" r="94" fill="url(#skyBg)" stroke="url(#skyGold)" stroke-width="3" filter="url(#skyGlow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4" />

  <!-- 360 Degree Vortex Flare / Power Arc -->
  <path d="M 25 100 A 75 75 0 0 1 175 100" fill="none" stroke="url(#skyGold)" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <path d="M 35 115 A 70 70 0 0 0 165 115" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />

  <!-- Shoulders & Jersey (India Blue / MI Blue) -->
  <path d="M 38 185 C 42 145 65 132 100 132 C 135 132 158 145 162 185 Z" fill="url(#skyJersey)" stroke="#001428" stroke-width="1.5" />
  <!-- Jersey Collar & Gold Trim -->
  <path d="M 85 132 L 100 152 L 115 132 Z" fill="#ff9933" />
  <path d="M 88 132 L 100 148 L 112 132 Z" fill="#002244" />
  <circle cx="100" cy="168" r="7" fill="url(#skyGold)" opacity="0.9" />
  <text x="100" y="171" font-family="sans-serif" font-size="7" font-weight="bold" fill="#001428" text-anchor="middle">63</text>

  <!-- Neck -->
  <path d="M 88 115 L 88 134 L 112 134 L 112 115 Z" fill="url(#skySkin)" />

  <!-- Head / Face -->
  <path d="M 72 82 C 72 116 82 126 100 126 C 118 126 128 116 128 82 C 128 62 118 52 100 52 C 82 52 72 62 72 82 Z" fill="url(#skySkin)" />

  <!-- Signature T20 Fade Haircut & Beard -->
  <path d="M 68 70 C 68 50 80 40 100 40 C 120 40 132 50 132 70 C 132 75 130 78 128 78 C 126 62 118 48 100 48 C 82 48 74 62 72 78 C 70 78 68 75 68 70 Z" fill="#1e1510" />
  <!-- Sharp Trim Beard & Mustache -->
  <path d="M 75 92 C 75 116 85 125 100 125 C 115 125 125 116 125 92 C 125 98 122 108 115 114 C 108 120 92 120 85 114 C 78 108 75 98 75 92 Z" fill="#1a110a" opacity="0.85" />
  <path d="M 88 106 C 94 103 106 103 112 106 C 108 109 92 109 88 106 Z" fill="#1a110a" />

  <!-- Eyes, Eyebrows & Athletic Focused Expression -->
  <path d="M 80 77 C 84 74 90 74 94 77" stroke="#120c06" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 106 77 C 110 74 116 74 120 77" stroke="#120c06" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="87" cy="82" r="2.2" fill="#261708" />
  <circle cx="113" cy="82" r="2.2" fill="#261708" />
  <circle cx="88" cy="81" r="0.7" fill="#fff" />
  <circle cx="114" cy="81" r="0.7" fill="#fff" />

  <!-- Nose & Confident Smile -->
  <path d="M 98 83 L 96 95 L 104 95" stroke="#8d4914" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 92 101 C 96 104 104 104 108 101" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Diamond Earring -->
  <circle cx="72" cy="88" r="1.5" fill="#e0f2fe" stroke="#fff" stroke-width="0.8" />

  <!-- 360° SKY Signature Badge -->
  <g transform="translate(142, 38)">
    <circle cx="14" cy="14" r="15" fill="#002244" stroke="url(#skyGold)" stroke-width="1.8" filter="url(#skyGlow)" />
    <text x="14" y="13" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#38bdf8" text-anchor="middle">360°</text>
    <text x="14" y="21" font-family="system-ui, sans-serif" font-size="6" font-weight="900" fill="url(#skyGold)" text-anchor="middle">SKY</text>
  </g>
</svg>
