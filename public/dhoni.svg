<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="csk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="csk-jersey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c59a"/>
      <stop offset="100%" stop-color="#d99b68"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="csk-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#csk-bg)" rx="28"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Shoulders / CSK Jersey -->
  <path d="M30 200 C30 152 65 142 100 142 C135 142 170 152 170 200 Z" fill="url(#csk-jersey)"/>
  
  <!-- Jersey Blue Shoulder Trims -->
  <path d="M30 200 C32 165 52 148 68 145 L74 165 C60 170 45 182 40 200 Z" fill="url(#csk-blue)"/>
  <path d="M170 200 C168 165 148 148 132 145 L126 165 C140 170 155 182 160 200 Z" fill="url(#csk-blue)"/>
  
  <!-- Jersey Collar & V-Neck -->
  <path d="M78 144 L100 170 L122 144 Z" fill="#1e3a8a"/>
  <path d="M84 144 L100 164 L116 144 Z" fill="url(#skin)"/>

  <!-- Jersey Lion Badge & Number 7 -->
  <circle cx="138" cy="172" r="14" fill="#1e3a8a" opacity="0.9"/>
  <text x="138" y="177" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#facc15" text-anchor="middle">7</text>

  <!-- Neck -->
  <rect x="86" y="118" width="28" height="30" rx="6" fill="url(#skin)"/>
  <!-- Neck Shadow -->
  <path d="M86 128 C95 136 105 136 114 128 L114 135 C105 142 95 142 86 135 Z" fill="#b97c4c" opacity="0.4"/>

  <!-- Head & Face -->
  <ellipse cx="100" cy="88" rx="34" ry="40" fill="url(#skin)"/>

  <!-- Ears -->
  <ellipse cx="66" cy="90" rx="6" ry="10" fill="#d99b68"/>
  <ellipse cx="134" cy="90" rx="6" ry="10" fill="#d99b68"/>

  <!-- Hair (Dhoni's iconic swept-back style) -->
  <path d="M66 84 C64 62 76 46 100 44 C124 46 136 62 134 84 C130 60 120 54 100 54 C80 54 70 60 66 84 Z" fill="url(#hair)"/>
  <path d="M68 64 C76 48 94 44 100 44 C106 44 124 48 132 64 C126 52 114 48 100 48 C86 48 74 52 68 64 Z" fill="#404040"/>
  
  <!-- Subtle Stubble / Beard -->
  <path d="M74 94 C74 118 84 126 100 126 C116 126 126 118 126 94 C126 114 116 124 100 124 C84 124 74 114 74 94 Z" fill="#262626" opacity="0.25"/>

  <!-- Eyes & Eyebrows -->
  <path d="M78 76 Q88 74 94 77" stroke="#171717" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M122 76 Q112 74 106 77" stroke="#171717" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="86" cy="84" rx="4" ry="4.5" fill="#171717"/>
  <ellipse cx="114" cy="84" rx="4" ry="4.5" fill="#171717"/>
  <circle cx="87.5" cy="82.5" r="1.2" fill="#ffffff"/>
  <circle cx="115.5" cy="82.5" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 82 L98 96 L104 96" stroke="#b97c4c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Confident Smile -->
  <path d="M88 108 Q100 116 112 108" stroke="#8c4e28" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Crown / Star Finisher Badge -->
  <g transform="translate(85, 14)">
    <circle cx="15" cy="15" r="13" fill="#1e3a8a" stroke="#facc15" stroke-width="1.5"/>
    <path d="M15 6 L17.5 12 L24 12.5 L19 17 L20.5 23 L15 19.5 L9.5 23 L11 17 L6 12.5 L12.5 12 Z" fill="#facc15"/>
  </g>
</svg>
