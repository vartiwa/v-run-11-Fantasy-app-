<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="mi-jersey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold-trim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="skin-hardik" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a978"/>
      <stop offset="100%" stop-color="#be7f4c"/>
    </linearGradient>
    <linearGradient id="hair-fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#mi-bg)" rx="28"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Shoulders / Mumbai Titans Jersey -->
  <path d="M30 200 C30 150 65 140 100 140 C135 140 170 150 170 200 Z" fill="url(#mi-jersey)"/>
  
  <!-- Jersey Gold Side Panels -->
  <path d="M30 200 C32 165 48 148 64 144 L70 162 C58 168 45 180 40 200 Z" fill="url(#gold-trim)"/>
  <path d="M170 200 C168 165 152 148 136 144 L130 162 C142 168 155 180 160 200 Z" fill="url(#gold-trim)"/>
  
  <!-- Collar & V-Neck -->
  <path d="M78 142 L100 168 L122 142 Z" fill="#0f172a"/>
  <path d="M84 142 L100 162 L116 142 Z" fill="url(#skin-hardik)"/>

  <!-- Lightning Badge / Number 33 -->
  <circle cx="138" cy="172" r="14" fill="#1e3a8a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="138" y="177" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">33</text>

  <!-- Neck -->
  <rect x="86" y="116" width="28" height="30" rx="6" fill="url(#skin-hardik)"/>
  <!-- Neck Shadow -->
  <path d="M86 126 C95 134 105 134 114 126 L114 133 C105 140 95 140 86 133 Z" fill="#9c5f31" opacity="0.4"/>

  <!-- Head & Face -->
  <ellipse cx="100" cy="86" rx="33" ry="39" fill="url(#skin-hardik)"/>

  <!-- Ears with Diamond Earring -->
  <ellipse cx="67" cy="88" rx="5.5" ry="9" fill="#be7f4c"/>
  <ellipse cx="133" cy="88" rx="5.5" ry="9" fill="#be7f4c"/>
  <circle cx="67" cy="94" r="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5"/>

  <!-- Hair (Hardik's stylish modern textured fade) -->
  <path d="M68 76 C66 52 76 42 100 40 C124 42 134 52 132 76 C130 52 120 48 100 48 C80 48 70 52 68 76 Z" fill="url(#hair-fade)"/>
  <path d="M74 54 C82 42 98 38 106 38 C116 38 126 44 126 56 C120 44 110 42 100 42 C90 42 80 46 74 54 Z" fill="#44403c"/>

  <!-- Stylish Trimmed Beard -->
  <path d="M72 88 C72 116 82 124 100 124 C118 124 128 116 128 88 C128 112 118 122 100 122 C82 122 72 112 72 88 Z" fill="#1c1917" opacity="0.75"/>
  <path d="M88 100 Q100 106 112 100 L112 104 Q100 110 88 104 Z" fill="#1c1917" opacity="0.8"/>

  <!-- Eyes & Eyebrows (Focused, confident gaze) -->
  <path d="M78 74 Q88 71 94 74" stroke="#0c0a09" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M122 74 Q112 71 106 74" stroke="#0c0a09" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="86" cy="82" rx="4" ry="4" fill="#0c0a09"/>
  <ellipse cx="114" cy="82" rx="4" ry="4" fill="#0c0a09"/>
  <circle cx="87.5" cy="80.5" r="1.2" fill="#ffffff"/>
  <circle cx="115.5" cy="80.5" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 80 L98 94 L104 94" stroke="#9c5f31" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Clutch Smirk -->
  <path d="M90 106 Q100 112 110 107" stroke="#7c3f1c" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Impact All-Rounder Lightning Emblem -->
  <g transform="translate(85, 14)">
    <circle cx="15" cy="15" r="13" fill="#2563eb" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M17 6 L10 16 L15 16 L13 24 L20 14 L15 14 Z" fill="#facc15"/>
  </g>
</svg>
