<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="srh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="srh-jersey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="skin-klaasen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="hair-blonde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#srh-bg)" rx="28"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fed7aa" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Broad Shoulders / SRH Orange Jersey -->
  <path d="M25 200 C25 148 62 138 100 138 C138 138 175 148 175 200 Z" fill="url(#srh-jersey)"/>
  
  <!-- Black Geometric Shoulder Wings -->
  <path d="M25 200 C28 162 48 145 66 142 L72 160 C58 166 42 180 36 200 Z" fill="#18181b"/>
  <path d="M175 200 C172 162 152 145 134 142 L128 160 C142 166 158 180 164 200 Z" fill="#18181b"/>

  <!-- Collar & V-Neck -->
  <path d="M78 140 L100 166 L122 140 Z" fill="#18181b"/>
  <path d="M84 140 L100 160 L116 140 Z" fill="url(#skin-klaasen)"/>

  <!-- Power Hitter / Number 45 -->
  <circle cx="140" cy="172" r="14" fill="#18181b" stroke="#f97316" stroke-width="1.5"/>
  <text x="140" y="177" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">45</text>

  <!-- Powerful Neck -->
  <rect x="85" y="114" width="30" height="32" rx="6" fill="url(#skin-klaasen)"/>
  <path d="M85 125 C95 133 105 133 115 125 L115 132 C105 139 95 139 85 132 Z" fill="#ea580c" opacity="0.3"/>

  <!-- Head & Square Strong Jaw -->
  <ellipse cx="100" cy="85" rx="34" ry="38" fill="url(#skin-klaasen)"/>

  <!-- Ears -->
  <ellipse cx="66" cy="87" rx="5.5" ry="9.5" fill="#fdba74"/>
  <ellipse cx="134" cy="87" rx="5.5" ry="9.5" fill="#fdba74"/>

  <!-- Hair (Blonde short textured cut) -->
  <path d="M68 76 C65 52 76 42 100 40 C124 42 135 52 132 76 C130 54 118 48 100 48 C82 48 70 54 68 76 Z" fill="url(#hair-blonde)"/>
  <path d="M74 54 C82 42 96 42 104 42 C116 42 126 48 126 58 C120 46 110 44 100 44 C90 44 80 48 74 54 Z" fill="#fef08a"/>

  <!-- Eyes & Eyebrows (Piercing, focused gaze) -->
  <path d="M78 74 Q88 71 94 74" stroke="#a16207" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M122 74 Q112 71 106 74" stroke="#a16207" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="86" cy="82" rx="4" ry="4" fill="#1e3a8a"/>
  <ellipse cx="114" cy="82" rx="4" ry="4" fill="#1e3a8a"/>
  <circle cx="87.5" cy="80.5" r="1.2" fill="#ffffff"/>
  <circle cx="115.5" cy="80.5" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 79 L98 94 L104 94" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Intense Focus Line -->
  <path d="M90 106 Q100 110 110 106" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Explosive Fireball Badge -->
  <g transform="translate(85, 14)">
    <circle cx="15" cy="15" r="13" fill="#ea580c" stroke="#f97316" stroke-width="1.5"/>
    <path d="M15 6 C17 10 19 12 21 14 C23 16 23 19 21 21 C19 23 15 24 13 22 C11 20 11 17 13 14 C13 16 15 17 16 17 C16 15 15 14 14 13 C14 10 15 8 15 6 Z" fill="#fef08a"/>
  </g>
</svg>
