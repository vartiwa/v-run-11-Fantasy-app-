<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="csk-bg-jaddu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="csk-jersey-jaddu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="skin-jaddu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2aa7a"/>
      <stop offset="100%" stop-color="#be7b4a"/>
    </linearGradient>
    <linearGradient id="hair-jaddu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="csk-blue-jaddu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#csk-bg-jaddu)" rx="28"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Shoulders / CSK Yellow Jersey -->
  <path d="M30 200 C30 152 65 142 100 142 C135 142 170 152 170 200 Z" fill="url(#csk-jersey-jaddu)"/>
  
  <!-- Blue Shoulder Trims -->
  <path d="M30 200 C32 165 52 148 68 145 L74 165 C60 170 45 182 40 200 Z" fill="url(#csk-blue-jaddu)"/>
  <path d="M170 200 C168 165 148 148 132 145 L126 165 C140 170 155 182 160 200 Z" fill="url(#csk-blue-jaddu)"/>

  <!-- Collar & V-Neck -->
  <path d="M78 144 L100 170 L122 144 Z" fill="#1e3a8a"/>
  <path d="M84 144 L100 164 L116 144 Z" fill="url(#skin-jaddu)"/>

  <!-- Jersey Number 8 -->
  <circle cx="138" cy="172" r="14" fill="#1e3a8a" opacity="0.9"/>
  <text x="138" y="177" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#facc15" text-anchor="middle">8</text>

  <!-- Neck -->
  <rect x="86" y="118" width="28" height="30" rx="6" fill="url(#skin-jaddu)"/>
  <path d="M86 128 C95 136 105 136 114 128 L114 135 C105 142 95 142 86 135 Z" fill="#9c5f31" opacity="0.4"/>

  <!-- Head & Face -->
  <ellipse cx="100" cy="88" rx="33" ry="39" fill="url(#skin-jaddu)"/>

  <!-- Ears -->
  <ellipse cx="67" cy="90" rx="5.5" ry="9" fill="#be7b4a"/>
  <ellipse cx="133" cy="90" rx="5.5" ry="9" fill="#be7b4a"/>

  <!-- Jadeja's Thick Voluminous Hair -->
  <path d="M66 84 C62 52 74 40 100 38 C126 40 138 52 134 84 C130 52 118 46 100 46 C82 46 70 52 66 84 Z" fill="url(#hair-jaddu)"/>
  <path d="M70 56 C78 40 96 36 104 36 C116 36 126 42 128 54 C120 40 110 38 100 38 C88 38 78 42 70 56 Z" fill="#44403c"/>

  <!-- Jadeja's Iconic Full Rajputana Beard & Curled Moustache -->
  <path d="M68 86 C68 122 80 130 100 130 C120 130 132 122 132 86 C132 118 120 126 100 126 C80 126 68 118 68 86 Z" fill="#1c1917"/>
  <path d="M80 98 Q100 106 120 98 Q124 94 120 92 Q100 100 80 92 Q76 94 80 98 Z" fill="#0c0a09"/>

  <!-- Fierce, confident eyes -->
  <path d="M78 75 Q88 72 94 75" stroke="#0c0a09" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M122 75 Q112 72 106 75" stroke="#0c0a09" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="86" cy="82" rx="4" ry="4" fill="#0c0a09"/>
  <ellipse cx="114" cy="82" rx="4" ry="4" fill="#0c0a09"/>
  <circle cx="87.5" cy="80.5" r="1.2" fill="#ffffff"/>
  <circle cx="115.5" cy="80.5" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 80 L98 94 L104 94" stroke="#9c5f31" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Sword Celebration Emblem -->
  <g transform="translate(85, 14)">
    <circle cx="15" cy="15" r="13" fill="#1e3a8a" stroke="#facc15" stroke-width="1.5"/>
    <path d="M10 20 L20 10 M18 8 L22 12 M9 21 L12 22" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
