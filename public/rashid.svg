<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="gt-jersey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gt-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="skin-rashid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa87a"/>
      <stop offset="100%" stop-color="#ba7a48"/>
    </linearGradient>
    <linearGradient id="hair-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" fill="url(#gt-bg)" rx="28"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#99f6e4" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Shoulders / GT Deep Teal Jersey -->
  <path d="M30 200 C30 152 65 142 100 142 C135 142 170 152 170 200 Z" fill="url(#gt-jersey)"/>
  
  <!-- Gold Geometric Shoulder Streaks -->
  <path d="M30 200 C32 165 48 148 64 144 L70 162 C58 168 45 180 40 200 Z" fill="url(#gt-gold)"/>
  <path d="M170 200 C168 165 152 148 136 144 L130 162 C142 168 155 180 160 200 Z" fill="url(#gt-gold)"/>

  <!-- Collar & V-Neck -->
  <path d="M78 142 L100 168 L122 142 Z" fill="#134e4a"/>
  <path d="M84 142 L100 162 L116 142 Z" fill="url(#skin-rashid)"/>

  <!-- Spin Maestro Badge / Number 19 -->
  <circle cx="138" cy="172" r="14" fill="#134e4a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="138" y="177" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">19</text>

  <!-- Neck -->
  <rect x="86" y="116" width="28" height="30" rx="6" fill="url(#skin-rashid)"/>
  <path d="M86 126 C95 134 105 134 114 126 L114 133 C105 140 95 140 86 133 Z" fill="#9c5f31" opacity="0.4"/>

  <!-- Head & Face -->
  <ellipse cx="100" cy="86" rx="33" ry="39" fill="url(#skin-rashid)"/>

  <!-- Ears -->
  <ellipse cx="67" cy="88" rx="5.5" ry="9" fill="#ba7a48"/>
  <ellipse cx="133" cy="88" rx="5.5" ry="9" fill="#ba7a48"/>

  <!-- Hair (Clean styled dark hair) -->
  <path d="M68 76 C66 52 76 42 100 40 C124 42 134 52 132 76 C130 52 120 48 100 48 C80 48 70 52 68 76 Z" fill="url(#hair-dark)"/>
  <path d="M74 54 C82 44 98 42 106 42 C116 42 126 46 126 56 C120 46 110 44 100 44 C90 44 80 48 74 54 Z" fill="#374151"/>

  <!-- Well-groomed Full Beard & Moustache -->
  <path d="M72 88 C72 118 82 126 100 126 C118 126 128 118 128 88 C128 114 118 123 100 123 C82 123 72 114 72 88 Z" fill="#111827" opacity="0.85"/>
  <path d="M86 99 Q100 105 114 99 L114 103 Q100 109 86 103 Z" fill="#111827" opacity="0.9"/>

  <!-- Warm, expressive eyes -->
  <path d="M78 74 Q88 71 94 74" stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M122 74 Q112 71 106 74" stroke="#111827" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="86" cy="81" rx="4" ry="4" fill="#111827"/>
  <ellipse cx="114" cy="81" rx="4" ry="4" fill="#111827"/>
  <circle cx="87.5" cy="79.5" r="1.2" fill="#ffffff"/>
  <circle cx="115.5" cy="79.5" r="1.2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 80 L98 93 L104 93" stroke="#9c5f31" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Warm, friendly smile -->
  <path d="M88 106 Q100 114 112 106" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Spin Vortex Emblem -->
  <g transform="translate(85, 14)">
    <circle cx="15" cy="15" r="13" fill="#0f766e" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M15 7 A8 8 0 0 1 23 15 A8 8 0 0 1 15 23 A8 8 0 0 1 7 15" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="15" cy="15" r="3" fill="#ffffff"/>
  </g>
</svg>
